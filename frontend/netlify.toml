[[redirects]]
  from = "/api/v1/*"
  to = "https://smartfarm-backend.onrender.com/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "https://smartfarm-backend.onrender.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      X-XSS-Protection = "1; mode=block"
      Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self' ws: wss: https://api.openweathermap.org https://generativelanguage.googleapis.com;"
