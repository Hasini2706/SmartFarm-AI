services:
  # ----------------------------------------------------
  # 1. FastAPI Python Backend Service
  # ----------------------------------------------------
  - type: web
    name: smartfarm-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------
  # 2. React Vite Frontend Static Service
  # ----------------------------------------------------
  - type: web
    name: smartfarm-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    headers:
      - path: /*
        headers:
          - key: X-Frame-Options
            value: DENY
          - key: X-Content-Type-Options
            value: nosniff
    routes:
      # Single Page App routing rule: redirect all non-file routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
