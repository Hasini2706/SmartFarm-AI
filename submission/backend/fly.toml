# fly.toml app configuration file for Fly.io

app = "smartfarm-backend"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  group = "otp"
  type = "requests"
  hard_limit = 200
  soft_limit = 150

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  port = 8000
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512
